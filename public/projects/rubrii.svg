<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_rubrii" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <filter id="shadow_rubrii" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg_rubrii)" />

  <!-- Subtle grid -->
