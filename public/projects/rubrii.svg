      <text x="10" y="16" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="10">Chill; coldness aggravated</text>
      <text x="238" y="16" fill="#a1a1aa" font-family="'Geist Mono', monospace" font-size="9" text-anchor="end">Grade 2</text>
    </g>

