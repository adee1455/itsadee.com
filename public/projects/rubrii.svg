      <text x="223" y="26" fill="#a1a1aa" font-family="'Geist Mono', monospace" font-size="10" text-anchor="middle">88%</text>
    </g>

    <!-- Match 3 -->
    <g transform="translate(422, 264)">
      <rect x="0" y="0" width="264" height="46" rx="6" fill="#17171d" stroke="#2b2b36" stroke-width="1" />
