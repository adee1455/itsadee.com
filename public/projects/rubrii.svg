    <line x1="70" y1="398" x2="730" y2="398" stroke="#25252b" stroke-width="1" />
    <text x="94" y="421" fill="#71717a" font-family="'Geist Mono', monospace" font-size="10">TENTAXAUR STUDIO · PRODUCTION PILOT</text>
