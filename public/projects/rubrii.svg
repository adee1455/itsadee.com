      <rect x="194" y="12" width="58" height="22" rx="11" fill="#1f1f26" stroke="#383844" stroke-width="1" />
      <text x="223" y="26" fill="#a1a1aa" font-family="'Geist Mono', monospace" font-size="10" text-anchor="middle">64%</text>
    </g>

    <!-- Status Bar -->
