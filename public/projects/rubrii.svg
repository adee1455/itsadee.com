    <!-- Left: Natural Language Case Input & Symptom Extraction -->
    <rect x="94" y="110" width="290" height="268" rx="8" fill="#141418" stroke="#26262e" stroke-width="1" />
    <text x="114" y="136" fill="#71717a" font-family="'Geist Mono', monospace" font-size="10" letter-spacing="0.06em">PATIENT CHIEF COMPLAINTS</text>

    <rect x="114" y="150" width="250" height="60" rx="6" fill="#1a1a20" stroke="#2f2f3a" stroke-width="1" />
    <text x="126" y="172" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="11">"Intense migraine worse right side,</text>
