<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a30" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="800" y2="60" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="100" y1="0" x2="100" y2="480" />
    <line x1="200" y1="0" x2="200" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="500" y1="0" x2="500" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="700" y1="0" x2="700" y2="480" />
  </g>

  <!-- macOS Window Frame -->
  <g filter="url(#shadow)">
    <rect x="70" y="45" width="660" height="390" rx="12" fill="#111114" stroke="#2c2c34" stroke-width="1.2" />
    
    <!-- Title Bar -->
    <rect x="70" y="45" width="660" height="42" rx="12" fill="#18181c" />
    <rect x="70" y="75" width="660" height="12" fill="#18181c" />
    <line x1="70" y1="87" x2="730" y2="87" stroke="#25252b" stroke-width="1" />
    
    <!-- Traffic lights -->
    <circle cx="94" cy="66" r="5" fill="#3a3a42" />
    <circle cx="110" cy="66" r="5" fill="#3a3a42" />
    <circle cx="126" cy="66" r="5" fill="#3a3a42" />

    <!-- Window title -->
    <text x="400" y="70" fill="#a0a0aa" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.02em">Fettle — Finder Radial Menu</text>
    
    <!-- Privacy Pill -->
    <rect x="616" y="56" width="96" height="20" rx="10" fill="#202026" stroke="#2f2f38" stroke-width="1" />
    <circle cx="628" cy="66" r="3" fill="#22c55e" />
    <text x="638" y="70" fill="#a0a0aa" font-family="-apple-system, sans-serif" font-size="9.5" font-weight="500">100% Offline</text>

    <!-- App Content: Finder Shift-Drag Simulation -->
    <!-- Center Target File -->
    <g transform="translate(400, 255)">
      <!-- Outer Radial Ring -->
      <circle cx="0" cy="0" r="115" fill="none" stroke="#26262e" stroke-width="1" stroke-dasharray="4 4" />
      <circle cx="0" cy="0" r="145" fill="none" stroke="#26262e" stroke-width="1" stroke-opacity="0.5" />
      
      <!-- Connecting Rays -->
      <line x1="0" y1="-30" x2="0" y2="-95" stroke="#33333e" stroke-width="1.2" />
      <line x1="30" y1="0" x2="95" y2="0" stroke="#33333e" stroke-width="1.2" />
      <line x1="0" y1="30" x2="0" y2="95" stroke="#33333e" stroke-width="1.2" />
      <line x1="-30" y1="0" x2="-95" y2="0" stroke="#33333e" stroke-width="1.2" />

      <!-- Center File Node -->
      <rect x="-35" y="-35" width="70" height="70" rx="10" fill="#1c1c22" stroke="#383844" stroke-width="1.5" />
      <path d="M -12 -18 L 4 -18 L 12 -10 L 12 18 L -12 18 Z" fill="none" stroke="#e4e4e7" stroke-width="1.5" />
      <polyline points="4,-18 4,-10 12,-10" fill="none" stroke="#e4e4e7" stroke-width="1.5" />
      <text x="0" y="27" fill="#e4e4e7" font-family="-apple-system, sans-serif" font-size="9" font-weight="600" text-anchor="middle">raw_asset.png</text>
      
      <!-- Top Radial Node: Convert to WebP -->
      <g transform="translate(0, -115)">
        <rect x="-65" y="-18" width="130" height="36" rx="18" fill="#1e1e24" stroke="#4a4a58" stroke-width="1.2" />
        <text x="0" y="4" fill="#f4f4f5" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">⚡ Convert to WebP</text>
      </g>

      <!-- Right Radial Node: Compress Lossless -->
      <g transform="translate(115, 0)">
        <rect x="-18" y="-18" width="125" height="36" rx="18" fill="#1e1e24" stroke="#383844" stroke-width="1" />
        <text x="44" y="4" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Compress (-65%)</text>
      </g>

      <!-- Bottom Radial Node: Extract Text (OCR) -->
      <g transform="translate(0, 115)">
        <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#1e1e24" stroke="#383844" stroke-width="1" />
        <text x="0" y="4" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Extract Text (OCR)</text>
      </g>

      <!-- Left Radial Node: Remove BG -->
      <g transform="translate(-115, 0)">
        <rect x="-105" y="-18" width="125" height="36" rx="18" fill="#1e1e24" stroke="#383844" stroke-width="1" />
        <text x="-42" y="4" fill="#d4d4d8" font-family="-apple-system, sans-serif" font-size="11" font-weight="500" text-anchor="middle">Cutout / Remove BG</text>
      </g>
    </g>

    <!-- Bottom Status Bar -->
    <rect x="70" y="398" width="660" height="37" rx="0" fill="#141418" />
    <line x1="70" y1="398" x2="730" y2="398" stroke="#25252b" stroke-width="1" />
    <text x="94" y="421" fill="#71717a" font-family="'Geist Mono', monospace" font-size="10">TRIGGER: SHIFT + DRAG IN FINDER</text>
    <text x="706" y="421" fill="#71717a" font-family="'Geist Mono', monospace" font-size="10" text-anchor="end">SWIFT 6 · APPKIT · NATIVE MACOS</text>
  </g>
</svg>
